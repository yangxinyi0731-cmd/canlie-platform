services:
  - type: web
    name: canlie-platform
    env: node
    region: singapore
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/health
    disk:
      name: canlie-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/canlie.sqlite
      - key: DATA_DIR
        value: /var/data
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SERVE_HTTPS
        value: "true"
      - key: ENABLE_AUTOMATIC_BACKUPS
        value: "true"
      - key: AUTO_BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_RETENTION_COUNT
        value: "14"
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: "10000"
